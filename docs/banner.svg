    <clipPath id="flag">
      <rect x="64" y="64" width="384" height="232" rx="14"/>
    </clipPath>
  </defs>
  <rect width="1200" height="360" fill="#0b1530"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <g clip-path="url(#flag)">
