quirks:
  dynamic-function-key: API keys are embedded in a public frontend bundle and may rotate.
  untrusted-total-count: API total counts can exceed the number of returned records.
  frontend-normalization: Search text must use the frontend normalization rules.
  json-stat-dimensions: JSON-stat values must be mapped through ordered dimensions.
  scale-and-decimals: Values require the DECIMALS and IDESCALA metadata.
  date-range-required: Date bounds are required to retrieve the full time series.
  arcgis-layer-index: ArcGIS layers must be identified by layer metadata rather than assumed indexes.
  arcgis-paging: ArcGIS queries require resultOffset paging.
  encoded-layer-name: ArcGIS service paths contain non-ASCII names that must be URL-encoded.
  html-sections: Procedure details are grouped in rendered HTML sections.
  localized-route: Localized procedure pages use language-specific routes.
  feed-xml: Feed responses must be parsed as RSS or Atom XML.
  pdf-only: Some records are available only as PDF.
