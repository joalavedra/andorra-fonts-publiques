name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run offline tests
        run: pytest -q
      - name: Validate catalog
        run: python scripts/validate.py
      - name: Rebuild generated files
        run: python scripts/build.py
      - name: Check generated files are current
        run: git diff --exit-code -- catalog.json fonts_andorra/data/catalog.json llms.txt llms-full.txt
      - name: Build and check installed wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/python" "$GITHUB_WORKSPACE/scripts/check_wheel.py"
